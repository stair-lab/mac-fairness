[project]
name = "mac-fairness"
version = "0.9.2"
description = "Multi-agent conversation framework for fairness evaluation (Schema Version: 2025-12-10)"
readme = "README.md"
requires-python = ">=3.11,<3.14"

dependencies = [
    "vllm>=0.12.0; sys_platform != 'darwin'",
    "pyyaml>=6.0.3",
    "huggingface-hub[mcp]>=0.36.0; sys_platform != 'darwin'",
    "aiohttp[speedups]>=3.13.0",
]

[build-system]
requires = ["setuptools>=80.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
