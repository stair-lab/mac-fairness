[project]
name = "mac-fairness"
version = "0.9.6"
description = "Multi-agent conversation framework for fairness evaluation (Schema Version: 2025-12-10)"
readme = "README.md"
requires-python = ">=3.11,<3.14"

dependencies = [
    "aiohttp[speedups]>=3.13.0",
    "huggingface-hub[mcp]>=0.36.0; sys_platform != 'darwin'",
    "inflect>=7.5.0",
    "json-repair>=0.54.2",
    "pyyaml>=6.0.3",
    "torch-c-dlpack-ext>=0.1.4; sys_platform != 'darwin'",
    "flashinfer-python>=0.6.1; sys_platform != 'darwin'",
    "vllm>=0.15.1; sys_platform != 'darwin'",
    "ipykernel>=7.0.0; sys_platform == 'darwin'",
    "ipywidgets >= 8.1.8; sys_platform == 'darwin'",
]

[build-system]
requires = ["setuptools>=80.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
