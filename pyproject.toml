[project]
name = "mac-fairness"
version = "2025.11.27"
description = "Multi-agent conversation framework for fairness evaluation (Schema Version: 2025-11-27)"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "vllm>=0.11.0",
    "pyyaml>=6.0",
    # Note: Ollama should be installed separately from ollama.ai
    # The OllamaAgent uses subprocess to call the ollama CLI
]

[build-system]
requires = ["setuptools>=80.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
