# Dev Ollama configuration for Llama 3.2 1B Instruct
# This configuration tests the framework with real LLMs on local dev (no GPU required)

# Experiment identification
experiment_metadata:
  experiment_name: llama32_1b_3agent_as-human-demographics_vanilla_v2025-12-10
  benchmark_subcategory: dev_ollama
  schema_version: "2025-12-10"
  questions_file: data/BBQ/bbq_race.jsonl

# Conversation orchestration settings
conversation_config:
  routing_strategy: vanilla
  max_rounds: 3 # Keep it short for testing

# Response validation and retry behavior
retry_config:
  max_retries: 5
  answer_match_threshold: 0.75
  retry_on_validation_error: true
  retry_on_generation_error: true

# Identity reveal configuration - controls how agents perceive each other
identity_reveal_config:
  reveal_persona: true
  reveal_demographics: true
  reveal_presence_mode: true

# Prompt template configuration
prompt_template_config:
  for_participant:
    # How to display choices: bullet, letter/arabic/roman + _ + colon/dot/paren, none
    choice_display_format: none
    # Order of fields in JSON output: answer_first, rationale_first
    json_field_order: answer_first

# Model definitions
model_definitions:
  llama32_1b:
    backend: ollama
    model_name: llama3.2:1b-instruct-q4_K_M

    ollama_config:
      num_ctx: 2048

# Agent definitions
agent_definitions:
- agent_id: spkr_000
  role: participant
  persona: doctor
  demographics: black
  if_as_human: true
  model: llama32_1b
  temperature: 0.7
  max_tokens: 256

- agent_id: spkr_001
  role: participant
  persona: economist
  demographics: white
  if_as_human: true
  model: llama32_1b
  temperature: 0.7
  max_tokens: 256

- agent_id: spkr_002
  role: participant
  persona: policy expert
  demographics: null
  if_as_human: true
  model: llama32_1b
  temperature: 0.7
  max_tokens: 256
