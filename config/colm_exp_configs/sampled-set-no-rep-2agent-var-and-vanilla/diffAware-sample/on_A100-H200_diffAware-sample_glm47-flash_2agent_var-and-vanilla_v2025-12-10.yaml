# Grid configuration for parameter sweep experiments
# Dry run:  python script/run_job.py config/colm_exp_configs/config_scratch_name.yaml --grid --dry-run
# Run with: CUDA_VISIBLE_DEVICES=X TOKENIZERS_PARALLELISM=false OMP_NUM_THREADS=4 MAC_FAIRNESS_LIVE_STATUS=1 python script/run_job.py config/colm_exp_configs/config_scratch_name.yaml --grid --rep 1

# Grid configuration - defines parameter sweep
_grid:
  # Derivation rules: automatically compute field values from other fields
  # Uses {field.path} placeholders with full dot-notation paths
  derive:
    experiment_metadata.questions_file: "data/DifferenceAwareness/sampled/{experiment_metadata.benchmark_subcategory}.jsonl"

  # Sweep parameters: all combinations will be generated and run
  sweep:
    experiment_metadata.benchmark_subcategory:
      - diffAware_d1_sampled
      - diffAware_d2_sampled
      - diffAware_d3_sampled
      - diffAware_d4_sampled
      - diffAware_n1_sampled
      - diffAware_n2_sampled
      - diffAware_n3_sampled
      - diffAware_n4_sampled
    # Only varying agent 0
    agent_definitions.0.demographics:
      - black
      - white
      - young
      - older
      - male
      - female
      # - black older female
      # - white young male
      - null
    agent_definitions.0.persona:
      - software engineer
      - teacher
      - physician
      - farmer
      - machine operator
      - null
    agent_definitions.0.if_as_human:
      - true
      - false

  # Zip: paired values that change together (not Cartesian product)
  # Use {runtime.timestamp} for auto-generated timestamps (format: YYYYMMDDTHHmmZ)
  # Run with --rep N to repeat the entire grid N times with different timestamps
  zip:
    identity_reveal_condition:
      # --> completely anonymous to each other
      - identity_reveal_config.reveal_persona: false
        identity_reveal_config.reveal_demographics: false
        identity_reveal_config.reveal_presence_mode: false # if false, all others must be false
      # # --> others can only see presence mode as-ai or as-human
      # - identity_reveal_config.reveal_persona: false
      #   identity_reveal_config.reveal_demographics: false
      #   identity_reveal_config.reveal_presence_mode: true
      # # --> others can see see presence mode + persona
      # - identity_reveal_config.reveal_persona: true
      #   identity_reveal_config.reveal_demographics: false
      #   identity_reveal_config.reveal_presence_mode: true
      # # --> others can see see presence mode + demographics
      # - identity_reveal_config.reveal_persona: false
      #   identity_reveal_config.reveal_demographics: true
      #   identity_reveal_config.reveal_presence_mode: true
      # --> others can see presence mode + persona + demographics
      - identity_reveal_config.reveal_persona: true
        identity_reveal_config.reveal_demographics: true
        identity_reveal_config.reveal_presence_mode: true

    A100_model_specific_zipped_config: # A100 SXM4 (80GB)
      # --> zai-org/GLM-4.7-Flash
      - experiment_metadata.experiment_name: "{runtime.timestamp}_glm47-30b_2agent_var-and-vanilla_v2025-12-10"
        agent_definitions.0.temperature: 1.0 # intentional, following suggested sampling param
        agent_definitions.0.top_p: 0.95 # intentional, following suggested sampling param
        agent_definitions.0.enable_thinking: false # GLM-4.7-Flash: disable CoT to speed up and get direct JSON output
        agent_definitions.1.temperature: 1.0 # intentional, following suggested sampling param
        agent_definitions.1.top_p: 0.95 # intentional, following suggested sampling param
        agent_definitions.1.enable_thinking: false # GLM-4.7-Flash: disable CoT to speed up and get direct JSON output
        model_definitions.llm_0.model_path: zai-org/GLM-4.7-Flash
        model_definitions.llm_0.vllm_config.tensor_parallel_size: 1 # 2
        model_definitions.llm_0.vllm_config.attention_backend: "TRITON_MLA"
        retry_config.max_retries: 5

    A100_hpc_node_specific_zipped_config:
      - model_definitions.llm_0.vllm_config.gpu_memory_utilization: 0.90
        model_definitions.llm_0.vllm_config.enforce_eager: false

# Base experiment configuration (used as template for all combinations)
experiment_metadata:
  experiment_name: _ # will be overwritten by zip
  benchmark_subcategory: _ # will be overwritten by sweep
  schema_version: "2025-12-10"
  questions_file: _ # will be overwritten by derive rule

# Conversation orchestration settings
conversation_config:
  routing_strategy: vanilla
  max_rounds: 3

# Response validation and retry behavior
retry_config:
  max_retries: _ # will be overwritten by zip
  answer_match_threshold: 0.75
  retry_on_validation_error: true
  retry_on_generation_error: true

# Identity reveal configuration - controls how agents perceive each other
# handled by zip

# Prompt template configuration
prompt_template_config:
  for_participant:
    choice_display_format: none # fixed for "natural" conversation
    json_field_order: rationale_first # fixed for "natural" conversation

# Model definitions
model_definitions:
  llm_0:
    backend: vllm
    model_path: _ # will be overwritten by zip

    vllm_config:
      tensor_parallel_size: _ # will be overwritten by zip
      gpu_memory_utilization: _ # will be overwritten by zip
      max_model_len: 4096 # 4096 minimum for multi-agent multi-round
      dtype: auto # let vLLM auto-detect optimal dtype
      max_num_seqs_upper_bound: 1024 # sufficently large upperbound, actual value limited by KV cache
      enable_prefix_caching: true
      attention_backend: _ # will be overwritten by zip
      enforce_eager: _ # will be overwritten by zip

# Agent definitions
agent_definitions:
  - agent_id: spkr_000
    role: participant
    persona: _ # will be overwritten by sweep
    demographics: _ # will be overwritten by sweep
    if_as_human: _ # will be overwritten by sweep
    model: llm_0
    temperature: _ # will be overwritten by zip
    # top_p: _ # will be overwritten by zip
    # top_k: _ # will be overwritten by zip
    # min_p: _ # will be overwritten by zip
    # presence_penalty: _ # will be overwritten by zip
    # enable_thinking: _ # will be overwritten by zip
    max_tokens: 512

  - agent_id: spkr_001
    role: participant
    persona: null
    demographics: null
    if_as_human: false
    model: llm_0
    temperature: _ # will be overwritten by zip
    # top_p: _ # will be overwritten by zip
    # top_k: _ # will be overwritten by zip
    # min_p: _ # will be overwritten by zip
    # presence_penalty: _ # will be overwritten by zip
    # enable_thinking: _ # will be overwritten by zip
    max_tokens: 512
