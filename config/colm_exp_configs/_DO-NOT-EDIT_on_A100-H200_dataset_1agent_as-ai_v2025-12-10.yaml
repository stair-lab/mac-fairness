      #   model_definitions.llm_0.vllm_config.tensor_parallel_size: 1
      #   model_definitions.llm_0.vllm_config.attention_backend: "FLASH_ATTN"
      #   retry_config.max_retries: 15 # intentional
      # # --> mistralai/Ministral-3-3B-Instruct-2512
      # - experiment_metadata.experiment_name: "{runtime.timestamp}_ministral3-3b_1agent_as-ai_v2025-12-10"
