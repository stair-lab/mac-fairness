# Grid configuration for parameter sweep experiments
# Dry run:  python script/run_job.py config/colm_exp_configs/config_scratch_name.yaml --grid --dry-run
# Run with: TOKENIZERS_PARALLELISM=false CUDA_VISIBLE_DEVICES=0 OMP_NUM_THREADS=4 MAC_FAIRNESS_LIVE_STATUS=1 python script/run_job.py config/colm_exp_configs/config_scratch_name.yaml --grid --rep 5

# Grid configuration - defines parameter sweep
_grid:
  # Derivation rules: automatically compute field values from other fields
  # Uses {field.path} placeholders with full dot-notation paths
  derive:
    experiment_metadata.questions_file: "data/BBQ/sampled/{experiment_metadata.benchmark_subcategory}.jsonl"

  # Sweep parameters: all combinations will be generated and run
  sweep:
    experiment_metadata.benchmark_subcategory:
      - bbq_age_sampled
      - bbq_disability_status_sampled
      - bbq_gender_identity_sampled
      - bbq_nationality_sampled
      - bbq_physical_appearance_sampled
      - bbq_race_ethnicity_sampled
      - bbq_race_x_gender_sampled
      - bbq_race_x_ses_sampled
      - bbq_religion_sampled
      - bbq_ses_sampled
      - bbq_sexual_orientation_sampled
    prompt_template_config.for_participant.choice_display_format:
      - bullet
      - letter_colon
      - letter_dot
      - letter_paren
      - arabic_colon
      - arabic_dot
      - arabic_paren
      - roman_colon
      - roman_dot
      - roman_paren
      - none
    prompt_template_config.for_participant.json_field_order:
      - answer_first
      - rationale_first

  # Zip: paired values that change together (not Cartesian product)
  # Use {runtime.timestamp} for auto-generated timestamps (format: YYYYMMDDTHHmmZ)
  # Run with --rep N to repeat the entire grid N times with different timestamps
  zip:
    A100_model_specific_zipped_config: # A100 SXM4 (80GB)
      # ... Small models (tensor_parallel_size: 1, CUDA_VISIBLE_DEVICES=X)
