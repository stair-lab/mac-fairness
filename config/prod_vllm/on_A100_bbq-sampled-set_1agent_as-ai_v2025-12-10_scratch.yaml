# Grid configuration for parameter sweep experiments
# Dry run:  python script/run_job.py config/prod_vllm/on_A100_bbq-sampled-set_1agent_as-ai_v2025-12-10_scratch.yaml --grid --dry-run
# Run with: TOKENIZERS_PARALLELISM=false CUDA_VISIBLE_DEVICES=0 OMP_NUM_THREADS=4 MAC_FAIRNESS_LIVE_STATUS=1 python script/run_job.py config/prod_vllm/on_A100_bbq-sampled-set_1agent_as-ai_v2025-12-10_scratch.yaml --grid --rep 5

# Grid configuration - defines parameter sweep
_grid:
  # Derivation rules: automatically compute field values from other fields
  # Uses {field.path} placeholders with full dot-notation paths
  derive:
    experiment_metadata.questions_file: "data/BBQ/sampled/{experiment_metadata.benchmark_subcategory}.jsonl"

  # Sweep parameters: all combinations will be generated and run
  sweep:
    experiment_metadata.benchmark_subcategory:
      - bbq_age_sampled
      - bbq_disability_status_sampled
      - bbq_gender_identity_sampled
      - bbq_nationality_sampled
      - bbq_physical_appearance_sampled
      - bbq_race_ethnicity_sampled
      - bbq_race_x_gender_sampled
      - bbq_race_x_ses_sampled
      - bbq_religion_sampled
      - bbq_ses_sampled
      - bbq_sexual_orientation_sampled
    prompt_template_config.for_participant.choice_display_format:
      - bullet
      - letter_colon
      - letter_dot
      - letter_paren
      - arabic_colon
      - arabic_dot
      - arabic_paren
      - roman_colon
      - roman_dot
      - roman_paren
      - none
    prompt_template_config.for_participant.json_field_order:
      - answer_first
      - rationale_first

  # Zip: paired values that change together (not Cartesian product)
  # Use {runtime.timestamp} for auto-generated timestamps (format: YYYYMMDDTHHmmZ)
  # Run with --rep N to repeat the entire grid N times with different timestamps
  zip:
    # ... A100 SXM4 (80GB)
    A100_model_specific_zipped_config:
      # Medium models (tensor_parallel_size: 1)
      # --> google/gemma-2-9b-it
      - experiment_metadata.experiment_name: "{runtime.timestamp}_gemma2-9b_1agent_as-ai_v2025-12-10"
        agent_definitions.0.temperature: 0.7
        model_definitions.llm_0.model_path: google/gemma-2-9b-it
        model_definitions.llm_0.vllm_config.tensor_parallel_size: 1
        model_definitions.llm_0.vllm_config.attention_backend: "FLASHINFER"
        retry_config.max_retries: 5
      # # --> mistralai/Mistral-7B-Instruct-v0.3
      # - experiment_metadata.experiment_name: "{runtime.timestamp}_mistral03-7b_1agent_as-ai_v2025-12-10"
      #   agent_definitions.0.temperature: 0.7
      #   model_definitions.llm_0.model_path: mistralai/Mistral-7B-Instruct-v0.3
      #   model_definitions.llm_0.vllm_config.tensor_parallel_size: 1
      #   model_definitions.llm_0.vllm_config.attention_backend: "FLASHINFER"
      #   retry_config.max_retries: 5
      # # --> mistralai/Ministral-3-8B-Instruct-2512
      # - experiment_metadata.experiment_name: "{runtime.timestamp}_ministral3-8b_1agent_as-ai_v2025-12-10"
      #   agent_definitions.0.temperature: 0.7
      #   model_definitions.llm_0.model_path: mistralai/Ministral-3-8B-Instruct-2512
      #   model_definitions.llm_0.vllm_config.tensor_parallel_size: 1
      #   model_definitions.llm_0.vllm_config.attention_backend: "FLASHINFER"
      #   retry_config.max_retries: 5
      # # --> mistralai/Ministral-3-14B-Instruct-2512
      # - experiment_metadata.experiment_name: "{runtime.timestamp}_ministral3-14b_1agent_as-ai_v2025-12-10"
      #   agent_definitions.0.temperature: 0.7
      #   model_definitions.llm_0.model_path: mistralai/Ministral-3-14B-Instruct-2512
      #   model_definitions.llm_0.vllm_config.tensor_parallel_size: 1
      #   model_definitions.llm_0.vllm_config.attention_backend: "FLASHINFER"
      #   retry_config.max_retries: 5
      # Large models (tensor_parallel_size: 2, needs CUDA_VISIBLE_DEVICES=X,Y)
      # # --> meta-llama/Llama-3.1-70B-Instruct
      # - experiment_metadata.experiment_name: "{runtime.timestamp}_llama31-70b_1agent_as-ai_v2025-12-10"
      #   agent_definitions.0.temperature: 0.7
      #   model_definitions.llm_0.model_path: meta-llama/Llama-3.1-70B-Instruct
      #   model_definitions.llm_0.vllm_config.tensor_parallel_size: 2
      #   model_definitions.llm_0.vllm_config.attention_backend: "FLASHINFER"
      #   retry_config.max_retries: 5
      # # --> meta-llama/Llama-3.3-70B-Instruct
      # - experiment_metadata.experiment_name: "{runtime.timestamp}_llama33-70b_1agent_as-ai_v2025-12-10"
      #   agent_definitions.0.temperature: 0.7
      #   model_definitions.llm_0.model_path: meta-llama/Llama-3.3-70B-Instruct
      #   model_definitions.llm_0.vllm_config.tensor_parallel_size: 2
      #   model_definitions.llm_0.vllm_config.attention_backend: "FLASHINFER"
      #   retry_config.max_retries: 5

    A100_hpc_node_specific_zipped_config:
      - model_definitions.llm_0.vllm_config.gpu_memory_utilization: 0.90
        model_definitions.llm_0.vllm_config.enforce_eager: false

# Base experiment configuration (used as template for all combinations)
experiment_metadata:
  experiment_name: _ # will be overwritten by zip
  benchmark_subcategory: _ # will be overwritten by sweep
  schema_version: "2025-12-10"
  questions_file: _ # will be overwritten by derive rule

# Conversation orchestration settings
conversation_config:
  routing_strategy: vanilla
  max_rounds: 1

# Response validation and retry behavior
retry_config:
  max_retries: _ # will be overwritten by zip
  answer_match_threshold: 0.75
  retry_on_validation_error: true
  retry_on_generation_error: true

# Identity reveal configuration - controls how agents perceive each other
identity_reveal_config:
  reveal_persona: false
  reveal_demographics: false
  reveal_presence_mode: false

# Prompt template configuration
prompt_template_config:
  for_participant:
    choice_display_format: _ # will be overwritten by sweep
    json_field_order: _ # will be overwritten by sweep

# Model definitions
model_definitions:
  llm_0:
    backend: vllm
    model_path: _ # will be overwritten by zip

    vllm_config:
      tensor_parallel_size: _ # will be overwritten by zip
      gpu_memory_utilization: _ # will be overwritten by zip
      max_model_len: 2048
      dtype: auto # let vLLM auto-detect optimal dtype
      max_num_seqs_upper_bound: 1024 # sufficently large upperbound, actual value limited by KV cache
      enable_prefix_caching: true
      attention_backend: _ # will be overwritten by zip
      enforce_eager: _ # will be overwritten by zip

# Agent definitions
agent_definitions:
  - agent_id: spkr_000
    role: participant
    persona: null
    demographics: null
    if_as_human: false
    model: llm_0
    temperature: _ # will be overwritten by zip
    max_tokens: 512
