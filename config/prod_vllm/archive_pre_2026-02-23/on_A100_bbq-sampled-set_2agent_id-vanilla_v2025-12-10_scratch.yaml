# Multi-agent (2-agent, 3-round) grid config for BBQ sampled set — A100 SXM4 (80GB)
# §4.2: Core multi-agent experiment sweeping identity conditions × reveal conditions
#
# Dry run:  MAC_FAIRNESS_WORKSPACE=$(pwd) python script/run_job.py config/prod_vllm/on_A100_bbq-sampled-set_2agent_id-vanilla_v2025-12-10_scratch.yaml --grid --dry-run
# Run with: TOKENIZERS_PARALLELISM=false CUDA_VISIBLE_DEVICES=0 OMP_NUM_THREADS=4 MAC_FAIRNESS_LIVE_STATUS=1 python script/run_job.py config/prod_vllm/on_A100_bbq-sampled-set_2agent_id-vanilla_v2025-12-10_scratch.yaml --grid --rep 5

_grid:
  derive:
    experiment_metadata.questions_file: "data/BBQ/sampled/{experiment_metadata.benchmark_subcategory}.jsonl"

  # Sweep: 11 subcats × 4 persona × 5 demographics × 2 if_as_human = 440 combinations
  sweep:
    experiment_metadata.benchmark_subcategory:
      - bbq_age_sampled
      - bbq_disability_status_sampled
      - bbq_gender_identity_sampled
      - bbq_nationality_sampled
      - bbq_physical_appearance_sampled
      - bbq_race_ethnicity_sampled
      - bbq_race_x_gender_sampled
      - bbq_race_x_ses_sampled
      - bbq_religion_sampled
      - bbq_ses_sampled
      - bbq_sexual_orientation_sampled
    agent_definitions.0.persona:
      - doctor
      - economist
      - policy expert
      - null
    agent_definitions.0.demographics:
      - "Black"
      - "white"
      - "elder white female"
      - "Hispanic"
      - null
    agent_definitions.0.if_as_human:
      - true
      - false

  # Zip: 2 reveal conditions × 1 model config = 2 per sweep combo → total 880 tasks
  zip:
    # Revealed: identity-varied agent's identity visible to vanilla agent
    # Anonymous: no identity info visible to either agent
    reveal_condition:
      - identity_reveal_config.reveal_persona: true
        identity_reveal_config.reveal_demographics: true
        identity_reveal_config.reveal_presence_mode: true
      - identity_reveal_config.reveal_persona: false
        identity_reveal_config.reveal_demographics: false
        identity_reveal_config.reveal_presence_mode: false

    # Uncomment the desired model (one at a time per GPU)
    A100_model_specific_zipped_config:
      # Medium models (tensor_parallel_size: 1)
      # --> google/gemma-2-9b-it
      - experiment_metadata.experiment_name: "{runtime.timestamp}_gemma2-9b_2agent_id-vanilla_v2025-12-10"
        agent_definitions.0.temperature: 0.7
        agent_definitions.1.temperature: 0.7
        model_definitions.llm_0.model_path: google/gemma-2-9b-it
        model_definitions.llm_0.vllm_config.tensor_parallel_size: 1
        model_definitions.llm_0.vllm_config.attention_backend: "FLASHINFER"
        retry_config.max_retries: 5
      # # --> mistralai/Mistral-7B-Instruct-v0.3
      # - experiment_metadata.experiment_name: "{runtime.timestamp}_mistral03-7b_2agent_id-vanilla_v2025-12-10"
      #   agent_definitions.0.temperature: 0.7
      #   agent_definitions.1.temperature: 0.7
      #   model_definitions.llm_0.model_path: mistralai/Mistral-7B-Instruct-v0.3
      #   model_definitions.llm_0.vllm_config.tensor_parallel_size: 1
      #   model_definitions.llm_0.vllm_config.attention_backend: "FLASHINFER"
      #   retry_config.max_retries: 5
      # # --> mistralai/Ministral-3-8B-Instruct-2512
      # - experiment_metadata.experiment_name: "{runtime.timestamp}_ministral3-8b_2agent_id-vanilla_v2025-12-10"
      #   agent_definitions.0.temperature: 0.7
      #   agent_definitions.1.temperature: 0.7
      #   model_definitions.llm_0.model_path: mistralai/Ministral-3-8B-Instruct-2512
      #   model_definitions.llm_0.vllm_config.tensor_parallel_size: 1
      #   model_definitions.llm_0.vllm_config.attention_backend: "FLASHINFER"
      #   retry_config.max_retries: 5
      # # --> mistralai/Ministral-3-14B-Instruct-2512
      # - experiment_metadata.experiment_name: "{runtime.timestamp}_ministral3-14b_2agent_id-vanilla_v2025-12-10"
      #   agent_definitions.0.temperature: 0.7
      #   agent_definitions.1.temperature: 0.7
      #   model_definitions.llm_0.model_path: mistralai/Ministral-3-14B-Instruct-2512
      #   model_definitions.llm_0.vllm_config.tensor_parallel_size: 1
      #   model_definitions.llm_0.vllm_config.attention_backend: "FLASHINFER"
      #   retry_config.max_retries: 5
      # Large models (tensor_parallel_size: 2, needs CUDA_VISIBLE_DEVICES=X,Y)
      # # --> meta-llama/Llama-3.1-70B-Instruct
      # - experiment_metadata.experiment_name: "{runtime.timestamp}_llama31-70b_2agent_id-vanilla_v2025-12-10"
      #   agent_definitions.0.temperature: 0.7
      #   agent_definitions.1.temperature: 0.7
      #   model_definitions.llm_0.model_path: meta-llama/Llama-3.1-70B-Instruct
      #   model_definitions.llm_0.vllm_config.tensor_parallel_size: 2
      #   model_definitions.llm_0.vllm_config.attention_backend: "FLASHINFER"
      #   retry_config.max_retries: 5

    A100_hpc_node_specific_zipped_config:
      - model_definitions.llm_0.vllm_config.gpu_memory_utilization: 0.90
        model_definitions.llm_0.vllm_config.enforce_eager: false

# Base experiment configuration
experiment_metadata:
  experiment_name: _ # overwritten by zip
  benchmark_subcategory: _ # overwritten by sweep
  schema_version: "2025-12-10"
  questions_file: _ # overwritten by derive

conversation_config:
  routing_strategy: vanilla
  max_rounds: 3 # 3 rounds: round 0 (initial), round 1, round 2

retry_config:
  max_retries: _ # overwritten by zip
  answer_match_threshold: 0.75
  retry_on_validation_error: true
  retry_on_generation_error: true

# Identity reveal: overwritten by reveal_condition zip
identity_reveal_config:
  reveal_persona: _
  reveal_demographics: _
  reveal_presence_mode: _

prompt_template_config:
  for_participant:
    choice_display_format: none # fixed for multi-agent (not swept)
    json_field_order: answer_first

model_definitions:
  llm_0:
    backend: vllm
    model_path: _ # overwritten by zip

    vllm_config:
      tensor_parallel_size: _ # overwritten by zip
      gpu_memory_utilization: _ # overwritten by zip
      max_model_len: 4096 # increased from 2048: round-2 context reaches ~2k tokens
      dtype: auto
      max_num_seqs_upper_bound: 1024
      enable_prefix_caching: true
      attention_backend: _ # overwritten by zip
      enforce_eager: _ # overwritten by zip

# Agent definitions: spkr_000 = identity-varied (swept), spkr_001 = vanilla (fixed)
agent_definitions:
  - agent_id: spkr_000
    role: participant
    persona: null # overwritten by sweep
    demographics: null # overwritten by sweep
    if_as_human: false # overwritten by sweep
    model: llm_0
    temperature: _ # overwritten by zip
    max_tokens: 512

  - agent_id: spkr_001
    role: participant
    persona: null # always null (vanilla agent)
    demographics: null
    if_as_human: false
    model: llm_0
    temperature: _ # overwritten by zip
    max_tokens: 512
