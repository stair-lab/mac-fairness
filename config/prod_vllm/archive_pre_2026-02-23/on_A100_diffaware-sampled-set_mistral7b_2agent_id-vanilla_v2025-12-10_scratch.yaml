# Multi-agent (2-agent, 3-round) grid config for diffaware-sampled-set — A100 SXM4 (80GB) — mistral03-7b
# §4.2: Core multi-agent experiment sweeping identity conditions × reveal conditions
#
# Dry run:  MAC_FAIRNESS_WORKSPACE=$(pwd) python script/run_job.py config/prod_vllm/on_A100_diffaware-sampled-set_mistral7b_2agent_id-vanilla_v2025-12-10_scratch.yaml --grid --dry-run
# Run with: TOKENIZERS_PARALLELISM=false CUDA_VISIBLE_DEVICES=1 OMP_NUM_THREADS=4 MAC_FAIRNESS_LIVE_STATUS=1 python script/run_job.py config/prod_vllm/on_A100_diffaware-sampled-set_mistral7b_2agent_id-vanilla_v2025-12-10_scratch.yaml --grid --rep 5

_grid:
  derive:
    experiment_metadata.questions_file: "data/DifferenceAwareness/sampled/{experiment_metadata.benchmark_subcategory}.jsonl"

  sweep:
    experiment_metadata.benchmark_subcategory:
      - diffAware_d1_sampled
      - diffAware_d2_sampled
      - diffAware_d3_sampled
      - diffAware_d4_sampled
      - diffAware_n1_sampled
      - diffAware_n2_sampled
      - diffAware_n3_sampled
      - diffAware_n4_sampled
    agent_definitions.0.persona:
      - doctor
      - economist
      - policy expert
      - null
    agent_definitions.0.demographics:
      - "Black"
      - "white"
      - "elder white female"
      - "Hispanic"
      - null
    agent_definitions.0.if_as_human:
      - true
      - false

  zip:
    reveal_condition:
      - identity_reveal_config.reveal_persona: true
        identity_reveal_config.reveal_demographics: true
        identity_reveal_config.reveal_presence_mode: true
      - identity_reveal_config.reveal_persona: false
        identity_reveal_config.reveal_demographics: false
        identity_reveal_config.reveal_presence_mode: false

    A100_model_specific_zipped_config:
      - experiment_metadata.experiment_name: "{runtime.timestamp}_mistral03-7b_2agent_id-vanilla_v2025-12-10"
        agent_definitions.0.temperature: 0.7
        agent_definitions.1.temperature: 0.7
        model_definitions.llm_0.model_path: mistralai/Mistral-7B-Instruct-v0.3
        model_definitions.llm_0.vllm_config.tensor_parallel_size: 1
        model_definitions.llm_0.vllm_config.attention_backend: "FLASHINFER"
        retry_config.max_retries: 5

    A100_hpc_node_specific_zipped_config:
      - model_definitions.llm_0.vllm_config.gpu_memory_utilization: 0.90
        model_definitions.llm_0.vllm_config.enforce_eager: false

experiment_metadata:
  experiment_name: _
  benchmark_subcategory: _
  schema_version: "2025-12-10"
  questions_file: _

conversation_config:
  routing_strategy: vanilla
  max_rounds: 3

retry_config:
  max_retries: _
  answer_match_threshold: 0.75
  retry_on_validation_error: true
  retry_on_generation_error: true

identity_reveal_config:
  reveal_persona: _
  reveal_demographics: _
  reveal_presence_mode: _

prompt_template_config:
  for_participant:
    choice_display_format: none
    json_field_order: answer_first

model_definitions:
  llm_0:
    backend: vllm
    model_path: _

    vllm_config:
      tensor_parallel_size: _
      gpu_memory_utilization: _
      max_model_len: 4096
      dtype: auto
      max_num_seqs_upper_bound: 1024
      enable_prefix_caching: true
      attention_backend: _
      enforce_eager: _

agent_definitions:
  - agent_id: spkr_000
    role: participant
    persona: null
    demographics: null
    if_as_human: false
    model: llm_0
    temperature: _
    max_tokens: 512

  - agent_id: spkr_001
    role: participant
    persona: null
    demographics: null
    if_as_human: false
    model: llm_0
    temperature: _
    max_tokens: 512
