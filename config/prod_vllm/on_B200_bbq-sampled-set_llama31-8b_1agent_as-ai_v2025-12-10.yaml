# B200 config for GPU 7 on skampere3 - llama-3.1-8b-instruct (pre-cached)
# Run: CUDA_VISIBLE_DEVICES=7 ... python script/run_job.py this_file --grid --rep 5

_grid:
  derive:
    experiment_metadata.questions_file: "data/BBQ/sampled/{experiment_metadata.benchmark_subcategory}.jsonl"

  sweep:
    experiment_metadata.benchmark_subcategory:
      - bbq_age_sampled
      - bbq_disability_status_sampled
      - bbq_gender_identity_sampled
      - bbq_nationality_sampled
      - bbq_physical_appearance_sampled
      - bbq_race_ethnicity_sampled
      - bbq_race_x_gender_sampled
      - bbq_race_x_ses_sampled
      - bbq_religion_sampled
      - bbq_ses_sampled
      - bbq_sexual_orientation_sampled
    prompt_template_config.for_participant.choice_display_format:
      - bullet
      - letter_colon
      - letter_dot
      - letter_paren
      - arabic_colon
      - arabic_dot
      - arabic_paren
      - roman_colon
      - roman_dot
      - roman_paren
      - none
    prompt_template_config.for_participant.json_field_order:
      - answer_first
      - rationale_first

  zip:
    B200_model_specific_zipped_config:
      # --> meta-llama/Llama-3.1-8B-Instruct (pre-cached on skampere3)
      - experiment_metadata.experiment_name: "{runtime.timestamp}_llama31-8b_1agent_as-ai_v2025-12-10"
        agent_definitions.0.temperature: 0.7
        model_definitions.llm_0.model_path: meta-llama/Llama-3.1-8B-Instruct
        model_definitions.llm_0.vllm_config.tensor_parallel_size: 1
        model_definitions.llm_0.vllm_config.attention_backend: "FLASH_ATTN"
        retry_config.max_retries: 5

    B200_hpc_node_specific_zipped_config:
      - model_definitions.llm_0.vllm_config.gpu_memory_utilization: 0.95
        model_definitions.llm_0.vllm_config.enforce_eager: true

experiment_metadata:
  experiment_name: _
  benchmark_subcategory: _
  schema_version: "2025-12-10"
  questions_file: _

conversation_config:
  routing_strategy: vanilla
  max_rounds: 1

retry_config:
  max_retries: _
  answer_match_threshold: 0.75
  retry_on_validation_error: true
  retry_on_generation_error: true

identity_reveal_config:
  reveal_persona: false
  reveal_demographics: false
  reveal_presence_mode: false

prompt_template_config:
  for_participant:
    choice_display_format: _
    json_field_order: _

model_definitions:
  llm_0:
    backend: vllm
    model_path: _
    vllm_config:
      tensor_parallel_size: _
      gpu_memory_utilization: _
      max_model_len: 2048
      dtype: auto
      max_num_seqs_upper_bound: 1024
      enable_prefix_caching: true
      attention_backend: _
      enforce_eager: _

agent_definitions:
  - agent_id: spkr_000
    role: participant
    persona: null
    demographics: null
    if_as_human: false
    model: llm_0
    temperature: _
    max_tokens: 512
