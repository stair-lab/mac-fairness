# Grid configuration for parameter sweep experiments
# Dry run:  python script/run_experiment.py config/my_exp/exp_name_v2025-12-10_grid.yaml --grid --dry-run
# Run with: python script/run_experiment.py config/my_exp/exp_name_v2025-12-10_grid.yaml --grid

# Grid configuration - defines parameter sweep
_grid:
  # Derivation rules: automatically compute field values from other fields
  # Uses {field.path} placeholders with full dot-notation paths
  derive:
    experiment_metadata.questions_file: "data/BBQ/sampled/{experiment_metadata.benchmark_subcategory}.jsonl"

  # Sweep parameters: all combinations will be generated and run
  sweep:
    experiment_metadata.benchmark_subcategory:
      - bbq_age_sampled
      - bbq_disability_status_sampled
      - bbq_gender_identity_sampled
      - bbq_nationality_sampled
      - bbq_physical_appearance_sampled
      - bbq_race_ethnicity_sampled
      - bbq_race_x_gender_sampled
      - bbq_race_x_ses_sampled
      - bbq_religion_sampled
      - bbq_ses_sampled
      - bbq_sexual_orientation_sampled
    prompt_template_config.for_participant.choice_display_format:
      - bullet
      - letter_colon
      - letter_dot
      - letter_paren
      - arabic_colon
      - arabic_dot
      - arabic_paren
      - roman_colon
      - roman_dot
      - roman_paren
      - none
    prompt_template_config.for_participant.json_field_order:
      - answer_first
      - rationale_first

  # Zip: paired values that change together (not Cartesian product)
  # Use {runtime.timestamp} for auto-generated timestamps (format: YYYYMMDDTHHmmZ)
  # Run with --rep N to repeat the entire grid N times with different timestamps
  zip:
    # ... RTX A4000 (16GB)
    RTX_A4000_model_specific_zipped_config:
      # # --> Qwen/Qwen2.5-1.5B-Instruct
      # - experiment_metadata.experiment_name: "{runtime.timestamp}_bbq-full-set_qwen25-1.5b_1agent_as-ai_v2025-12-10"
      #   agent_definitions.0.temperature: 0.7
      #   agent_definitions.0.top_p: 0.8
      #   agent_definitions.0.top_k: 20
      #   agent_definitions.0.min_p: 0
      #   model_definitions.llm_0.model_path: Qwen/Qwen2.5-1.5B-Instruct
      #   model_definitions.llm_0.vllm_config.tensor_parallel_size: 2
      #   model_definitions.llm_0.vllm_config.attention_backend: "FLASHINFER"
      #   retry_config.max_retries: 5
      # # --> Qwen/Qwen2.5-3B-Instruct
      # - experiment_metadata.experiment_name: "{runtime.timestamp}_bbq-full-set_qwen25-3b_1agent_as-ai_v2025-12-10"
      #   agent_definitions.0.temperature: 0.7
      #   agent_definitions.0.top_p: 0.8
      #   agent_definitions.0.top_k: 20
      #   agent_definitions.0.min_p: 0
      #   model_definitions.llm_0.model_path: Qwen/Qwen2.5-3B-Instruct
      #   model_definitions.llm_0.vllm_config.tensor_parallel_size: 2
      #   model_definitions.llm_0.vllm_config.attention_backend: "FLASHINFER"
      #   retry_config.max_retries: 5
      # --> Qwen/Qwen3-4B-Instruct-2507
      - experiment_metadata.experiment_name: "{runtime.timestamp}_bbq-sampled-set_qwen3-4b_1agent_as-ai_v2025-12-10"
        agent_definitions.0.temperature: 0.7
        agent_definitions.0.top_p: 0.8
        agent_definitions.0.top_k: 20
        agent_definitions.0.min_p: 0
        model_definitions.llm_0.model_path: Qwen/Qwen3-4B-Instruct-2507
