# Grid configuration for parameter sweep experiments
# Run with: python script/run_experiment.py config/dev_vllm/llama33_70b_3agent_as-hybrid-demographics-persona_vanilla_v2025-12-10_grid.yaml --grid
# Dry run:  python script/run_experiment.py config/dev_vllm/llama33_70b_3agent_as-hybrid-demographics-persona_vanilla_v2025-12-10_grid.yaml --grid --dry-run

# Grid configuration - defines parameter sweep
_grid:
  # Derivation rules: automatically compute field values from other fields
  # Uses {field.path} placeholders with full dot-notation paths
  derive:
    experiment_metadata.questions_file: "data/BBQ/{experiment_metadata.benchmark_subcategory}.jsonl"

  # Sweep parameters: all combinations will be generated and run
  sweep:
    experiment_metadata.experiment_name: [ vary-structure-both-prompt-and-response_1agent_as-ai_v2025-12-10 ]
    experiment_metadata.benchmark_subcategory: [ bbq_race ]
    prompt_template_config.for_participant.choice_display_format: [ bullet, letter_colon, letter_dot, letter_paren, arabic_colon, arabic_dot, arabic_paren, roman_colon, roman_dot, roman_paren, none ]
    prompt_template_config.for_participant.json_field_order: [ answer_first, rationale_first ]

# Base experiment configuration (used as template for all combinations)
experiment_metadata:
  experiment_name: _ # Will be overwritten by sweep
  benchmark_subcategory: _ # Will be overwritten by sweep
  schema_version: "2025-12-10"
  questions_file: _ # Will be overwritten by derive rule

# Conversation orchestration settings
conversation_config:
  routing_strategy: vanilla
  max_rounds: 1

# Response validation and retry behavior
retry_config:
  max_retries: 5
  answer_match_threshold: 0.75
  retry_on_validation_error: true
  retry_on_generation_error: true

# Identity reveal configuration - controls how agents perceive each other
identity_reveal_config:
  reveal_persona: false
  reveal_demographics: false
  reveal_presence_mode: false

# Prompt template configuration
prompt_template_config:
  for_participant:
    # How to display choices: bullet, letter/arabic/roman + _ + colon/dot/paren, none
    choice_display_format: _ # Will be overwritten by sweep
    # Order of fields in JSON output: answer_first, rationale_first
    json_field_order: _ # Will be overwritten by sweep

# Model definitions
model_definitions:
  llama33_70b:
    backend: vllm
    model_path: meta-llama/Llama-3.3-70B-Instruct

    vllm_config:
      tensor_parallel_size: 2
      gpu_memory_utilization: 0.95
      max_model_len: 2048
      dtype: auto # let vLLM auto-detect optimal dtype
      max_num_seqs_upper_bound: 256 # upperbound, actual value limited by KV cache
      enable_prefix_caching: true
      attention_backend: "FLASHINFER"

# Agent definitions
agent_definitions:
- agent_id: spkr_000
  role: participant
  persona: null
  demographics: null
  if_as_human: false
  model: llama33_70b
  temperature: 0.7
  max_tokens: 512
