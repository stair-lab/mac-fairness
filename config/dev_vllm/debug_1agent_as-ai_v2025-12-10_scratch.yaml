# Grid configuration for parameter sweep experiments
# Dry run:  python script/run_experiment.py config/my_exp/exp_name_v2025-12-10_grid.yaml --grid --dry-run
# Run with: python script/run_experiment.py config/my_exp/exp_name_v2025-12-10_grid.yaml --grid

# Grid configuration - defines parameter sweep
_grid:
  # Derivation rules: automatically compute field values from other fields
  # Uses {field.path} placeholders with full dot-notation paths
  derive:
    experiment_metadata.questions_file: "data/dev_vllm/{experiment_metadata.benchmark_subcategory}.jsonl"

  # Sweep parameters: all combinations will be generated and run
  sweep:
    experiment_metadata.benchmark_subcategory:
      - bbq_race_25qs
    prompt_template_config.for_participant.choice_display_format:
      - none
    prompt_template_config.for_participant.json_field_order:
      - rationale_first
    agent_definitions.0.temperature:
      - 0.7

  # Zip: paired values that change together (not Cartesian product)
  # Use {runtime.timestamp} for auto-generated timestamps (format: YYYYMMDDTHHmmZ)
  # Run with --rep N to repeat the entire grid N times with different timestamps
  zip:
    _model_specific_zipped_config:
      - experiment_metadata.experiment_name: "{runtime.timestamp}_debug_qwen3-4b_1agent_as-ai_v2025-12-10"
        model_definitions.llm_0.model_path: Qwen/Qwen3-4B-Instruct-2507
        model_definitions.llm_0.vllm_config.tensor_parallel_size: 2
        model_definitions.llm_0.vllm_config.attention_backend: "FLASHINFER"
        retry_config.max_retries: 5

    _hpc_node_specific_zipped_config:
      - model_definitions.llm_0.vllm_config.gpu_memory_utilization: 0.85
        model_definitions.llm_0.vllm_config.enforce_eager: true

# Base experiment configuration (used as template for all combinations)
experiment_metadata:
  experiment_name: _ # will be overwritten by zip
  benchmark_subcategory: _ # will be overwritten by sweep
  schema_version: "2025-12-10"
  questions_file: _ # will be overwritten by derive rule

# Conversation orchestration settings
conversation_config:
  routing_strategy: vanilla
  max_rounds: 1

# Response validation and retry behavior
retry_config:
  max_retries: _ # will be overwritten by zip
  answer_match_threshold: 0.75
  retry_on_validation_error: true
  retry_on_generation_error: true

# Identity reveal configuration - controls how agents perceive each other
identity_reveal_config:
  reveal_persona: false
  reveal_demographics: false
  reveal_presence_mode: false

# Prompt template configuration
prompt_template_config:
  for_participant:
    choice_display_format: _ # will be overwritten by sweep
    json_field_order: _ # will be overwritten by sweep

# Model definitions
model_definitions:
  llm_0:
    backend: vllm
    model_path: _ # will be overwritten by zip

    vllm_config:
      tensor_parallel_size: _ # will be overwritten by zip
      gpu_memory_utilization: _ # will be overwritten by zip
      max_model_len: 1024
      dtype: auto # let vLLM auto-detect optimal dtype
      max_num_seqs_upper_bound: 256 # sufficently large upperbound, actual value limited by KV cache
      enable_prefix_caching: true
      attention_backend: _ # will be overwritten by zip
      enforce_eager: _ # will be overwritten by zip

# Agent definitions
agent_definitions:
  - agent_id: spkr_000
    role: participant
    persona: null
    demographics: null
    if_as_human: false
    model: llm_0
    temperature: _ # will be overwritten by sweep
    max_tokens: 512
