# Dev vLLM configuration for meta-llama/Llama-3.3-70B-Instruct

# Experiment identification
experiment_metadata:
  experiment_name: llama33_70b_1agent_as-ai_vanilla_v2025-11-27
  benchmark_subcategory: bbq_race
  schema_version: "2025-11-27"
  questions_file: data/BBQ/bbq_race.jsonl

conversation_config:
  routing_strategy: vanilla
  max_rounds: 1

retry_config:
  max_retries: 5
  answer_match_threshold: 0.75
  retry_on_validation_error: true
  retry_on_generation_error: true

identity_reveal_config:
  reveal_persona: true
  reveal_demographics: true
  reveal_presence_mode: true

# Model definitions - specify model_path for any HuggingFace model
# The vllm_config values will be overridden during parameter sweeping
model_definitions:
  llama33_70b:
    backend: vllm
    model_path: meta-llama/Llama-3.3-70B-Instruct # ! NOTE modify

    vllm_config:
      tensor_parallel_size: 2 # ! NOTE modify
      # These values are conservative starting points
      # They will be overridden during parameter sweeping
      gpu_memory_utilization: 0.95 # ! NOTE modify
      max_model_len: 2048 # ! NOTE modify
      dtype: auto # let vLLM auto-detect optimal dtype
      max_num_seqs: 200 # ! NOTE modify
      enable_prefix_caching: true

agent_definitions:
- agent_id: spkr_000
  role: participant
  persona: null
  demographics: black
  if_as_human: false
  model: llama33_70b
  temperature: 0.7
  max_tokens: 512
