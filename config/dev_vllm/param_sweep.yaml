# Base config for parameter sweeping - model-agnostic template
# Use with: python script/cluster/vllm_param_sweep.py --config config/dev_vllm/param_sweep.yaml
#
# The vllm_config values here are conservative starting points.
# The sweep tool will override them during testing.

experiment_metadata:
  experiment_name: param_sweep_base
  benchmark_subcategory: dev_vllm
  schema_version: "2025-11-27"
  questions_file: data/BBQ/bbq_race.jsonl

conversation_config:
  routing_strategy: vanilla
  max_rounds: 3

retry_config:
  max_retries: 5
  answer_match_threshold: 0.75
  retry_on_validation_error: true
  retry_on_generation_error: true

identity_reveal_config:
  reveal_persona: true
  reveal_demographics: true
  reveal_presence_mode: true

# Model definitions - specify model_path for any HuggingFace model
# The vllm_config values will be overridden during parameter sweeping
model_definitions:
  sweep_model:
    backend: vllm
    model_path: meta-llama/Llama-3.1-70B-Instruct # ! NOTE modify

    vllm_config:
      tensor_parallel_size: 2 # ! NOTE modify
      # These values are conservative starting points
      # They will be overridden during parameter sweeping
      gpu_memory_utilization: 0.9 # ! NOTE modify
      max_model_len: 8192 # ! NOTE modify
      dtype: auto # let vLLM auto-detect optimal dtype
      max_num_seqs: 1 # ! NOTE modify
      enable_prefix_caching: true
      # enforce_eager: true

agent_definitions:
- agent_id: spkr_000
  role: participant
  persona: doctor
  demographics: black
  if_as_human: true
  model: sweep_model
  temperature: 0.7
  max_tokens: 512

- agent_id: spkr_001
  role: participant
  persona: doctor
  demographics: white
  if_as_human: true
  model: sweep_model
  temperature: 0.7
  max_tokens: 512

- agent_id: spkr_002
  role: participant
  persona: policy_expert
  demographics: null
  if_as_human: true
  model: sweep_model
  temperature: 0.7
  max_tokens: 512
