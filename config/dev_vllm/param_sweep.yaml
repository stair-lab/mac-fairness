# Base config for parameter sweeping - model-agnostic template
# Use with: python script/cluster/vllm_param_sweep.py --config config/dev_vllm/param_sweep.yaml
#
# The vllm_config values here are conservative starting points.
# The sweep tool will override them during testing.

experiment_metadata:
  experiment_name: param_sweep_base
  benchmark_subcategory: dev_vllm
  schema_version: "2025-11-27"
  questions_file: data/dev_vllm/bbq_race.jsonl

conversation_config:
  routing_strategy: vanilla
  max_rounds: 3

retry_config:
  max_retries: 5
  answer_match_threshold: 0.75
  retry_on_validation_error: true
  retry_on_generation_error: true

identity_reveal_config:
  reveal_persona: true
  reveal_demographics: true
  reveal_presence_mode: true

# Model definitions - specify model_path for any HuggingFace model
# The vllm_config values will be overridden during parameter sweeping
model_definitions:
  sweep_model:
    backend: vllm
    # Change this to test different models from HF cache:
    # - meta-llama/Llama-3.1-8B-Instruct  (128K context)
    # - meta-llama/Llama-3.2-1B-Instruct  (128K context)
    # - meta-llama/Llama-3.2-3B-Instruct  (128K context)
    # - mistralai/Mistral-7B-Instruct-v0.3  (32K context)
    # - Qwen/Qwen2.5-1.5B-Instruct  (128K context)
    # - Qwen/Qwen2.5-3B-Instruct  (128K context)
    # - Qwen/Qwen3-4B-Instruct-2507  (32K context)
    # - google/gemma-3-1b-it  (8K context)
    # - google/gemma-3-4b-it  (8K context)
    # - microsoft/Phi-3-mini-4k-instruct  (4K context)
    # - microsoft/Phi-3-mini-128k-instruct  (128K context)
    # - microsoft/Phi-3.5-mini-instruct  (128K context)
    # - microsoft/Phi-4-mini-instruct  (128K context)
    model_path: meta-llama/Llama-3.1-8B-Instruct

    vllm_config:
      tensor_parallel_size: 1
      # These values are conservative starting points
      # They will be overridden during parameter sweeping
      gpu_memory_utilization: 0.85
      max_model_len: 4096 # set to appropriate value
      dtype: auto # let vLLM auto-detect optimal dtype
      max_num_seqs: 1
      enable_prefix_caching: true

agent_definitions:
- agent_id: spkr_000
  role: participant
  persona: doctor
  demographics: black
  if_as_human: true
  model: sweep_model
  temperature: 0.7
  max_tokens: 512

- agent_id: spkr_001
  role: participant
  persona: doctor
  demographics: white
  if_as_human: true
  model: sweep_model
  temperature: 0.7
  max_tokens: 512

- agent_id: spkr_002
  role: participant
  persona: policy_expert
  demographics: null
  if_as_human: true
  model: sweep_model
  temperature: 0.7
  max_tokens: 512
